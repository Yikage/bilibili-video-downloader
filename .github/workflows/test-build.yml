name: "test build"

on:
  push:
    branches:
      - fix/bili-timeout-buvid
  workflow_dispatch:

env:
  REPO_NAME: bilibili-video-downloader

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy nsis installer
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/

      - name: Zip portable
        run: |
          cd src-tauri/target/release
          7z a -tzip ../../../artifacts/${{ env.REPO_NAME }}_windows_x64_portable.zip ${{ env.REPO_NAME }}.exe com.lanyeeee.bilibili-video-downloader-ffmpeg.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-build
          path: artifacts/*

  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/
          cd src-tauri/target/release
          tar -czf ../../../artifacts/${{ env.REPO_NAME }}_linux_amd64_portable.tar.gz ${{ env.REPO_NAME }} com.lanyeeee.bilibili-video-downloader-ffmpeg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-build
          path: artifacts/*

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, x86_64 ]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: ${{ matrix.arch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.arch }}-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/*.dmg artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-build-${{ matrix.arch }}
          path: artifacts/*
