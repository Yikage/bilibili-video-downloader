name: "windows test build"

on:
  push:
    branches:
      - fix/bili-timeout-buvid
  workflow_dispatch:

env:
  REPO_NAME: bilibili-video-downloader

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy nsis installer
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/

      - name: Zip portable
        run: |
          cd src-tauri/target/release
          7z a -tzip ../../../artifacts/${{ env.REPO_NAME }}_windows_x64_portable.zip ${{ env.REPO_NAME }}.exe com.lanyeeee.bilibili-video-downloader-ffmpeg.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-build
          path: artifacts/*
